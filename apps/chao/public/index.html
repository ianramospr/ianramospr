<h1 id="hero-title">YOUR PHOTOS.<br/><span class="marked">YOUR CALL.</span></h1>
</div>
<div class="hero-bottom">
<p class="intro">One photo at a time. Keep what you like.<br class="desktop-break"/> Review before deleting the rest.</p>
<a class="app-store-badge" href="/download"><img alt="Download on the App Store" height="40" src="/assets/app-store-black.svg" width="120"/></a>

</div>
<div aria-label="Swipe left to queue a photo or right to keep it" class="swipe-directions">
<div class="swipe-choice chao-choice"><img alt="" height="1080" src="/assets/Chao-Arrow.svg" width="2160"/></div>
<div aria-hidden="true" class="direction-divider"></div>
<div class="swipe-choice keep-choice"><img alt="" height="1080" src="/assets/Keep-Arrow.svg" width="2160"/></div>
</div>
